# Build the lemon image, scan it, promote it to `latest`, and record the new tag in the
# deployment repo (Jaed69/luciel-platform, env/tags.env). That commit triggers the deploy.
#
# Every build step lives in the reusable workflow, so this file stays a declaration of
# WHAT this app is, never a copy of HOW images are built.
#
# Requires the PLATFORM_DEPLOY_TOKEN secret: a fine-grained PAT with `contents: write`
# scoped to Jaed69/luciel-platform ONLY.
name: Release

on:
  push:
    branches: [main]

# One release at a time, in order: two quick pushes must not race to record the tag.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Temporary: pinned to the branch until the workflow is merged to main. Restore @main, tag-var
    # and platform-token together, once this image exists and LEMON_TAG is declared.
    uses: Jaed69/luciel-platform/.github/workflows/build-and-release.yml@chore/repo-split-groundwork
    permissions:
      contents: read
      packages: write
    with:
      image-name: lemon
